spring:
  application:
    name: notification-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=notification-service;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:sa}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:amqp://guest:guest@localhost:5672}
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

server:
  port: 8083

broker:
  type: ${BROKER_TYPE:rabbitmq}
  rabbitmq:
    exchange-name: ${BROKER_EXCHANGE_NAME:}
    notification-queue: ${BROKER_NOTIFICATION_QUEUE:notification.queue}
  sqs:
    queue-url: ${SQS_QUEUE_URL:}
