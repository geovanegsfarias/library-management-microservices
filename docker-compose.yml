services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  book-service:
    build:
      context: ./book-service
    container_name: book-service
    depends_on:
      - sqlserver
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=book-service;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${SQLSERVER_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

  loan-service:
    build:
      context: ./loan-service
    container_name: loan-service
    depends_on:
      - sqlserver
      - rabbitmq
      - book-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=loan-service;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${SQLSERVER_PASSWORD}
      SPRING_RABBITMQ_ADDRESSES: ${SPRING_RABBITMQ_ADDRESSES}
      BOOK_SERVICE_URL: http://book-service:8081
      BROKER_EXCHANGE_NAME: ${BROKER_EXCHANGE_NAME}
      BROKER_NOTIFICATION_QUEUE: ${BROKER_NOTIFICATION_QUEUE}
      JWT_PRIVATE_KEY_PATH: file:/run/secrets/app.key
      JWT_PUBLIC_KEY_PATH: file:/run/secrets/app.pub
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes:
      - ./loan-service/src/main/resources/app.key:/run/secrets/app.key:ro
      - ./loan-service/src/main/resources/app.pub:/run/secrets/app.pub:ro

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    depends_on:
      - sqlserver
      - rabbitmq
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=notification-service;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${SQLSERVER_PASSWORD}
      SPRING_RABBITMQ_ADDRESSES: ${SPRING_RABBITMQ_ADDRESSES}
      BROKER_EXCHANGE_NAME: ${BROKER_EXCHANGE_NAME}
      BROKER_NOTIFICATION_QUEUE: ${BROKER_NOTIFICATION_QUEUE}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

volumes:
  sqlserver-data: