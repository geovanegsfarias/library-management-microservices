services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_PASSWORD}' -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    depends_on:
      book-service:
        condition: service_started
      loan-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      BOOK_SERVICE_URI: ${BOOK_SERVICE_URI}
      LOAN_SERVICE_URI: ${LOAN_SERVICE_URI}

  book-service:
    build:
      context: ./book-service
    container_name: book-service
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=book-service;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${SQLSERVER_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

  loan-service:
    build:
      context: ./loan-service
    container_name: loan-service
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      book-service:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-localstack}
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=loan-service;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${SQLSERVER_PASSWORD}
      SPRING_RABBITMQ_ADDRESSES: ${SPRING_RABBITMQ_ADDRESSES}
      BOOK_SERVICE_URL: http://book-service:8081
      BROKER_EXCHANGE_NAME: ${BROKER_EXCHANGE_NAME}
      BROKER_NOTIFICATION_QUEUE: ${BROKER_NOTIFICATION_QUEUE}
      JWT_PRIVATE_KEY_PATH: file:/run/secrets/app.key
      JWT_PUBLIC_KEY_PATH: file:/run/secrets/app.pub
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      BROKER_TYPE: ${BROKER_TYPE}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SNS_ENDPOINT: ${AWS_SNS_ENDPOINT:-http://host.docker.internal:4566}
      AWS_SQS_ENDPOINT: ${AWS_SQS_ENDPOINT:-http://host.docker.internal:4566}
      SNS_ARN: ${SNS_ARN}
      OVERDUE_LOAN_CRON: "${OVERDUE_LOAN_CRON:-0 0 3 * * *}"
      OVERDUE_LOAN_ZONE: ${OVERDUE_LOAN_ZONE:-America/Sao_Paulo}
    volumes:
      - ./loan-service/src/main/resources/app.key:/run/secrets/app.key:ro
      - ./loan-service/src/main/resources/app.pub:/run/secrets/app.pub:ro

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-localstack}
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=notification-service;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${SQLSERVER_PASSWORD}
      SPRING_RABBITMQ_ADDRESSES: ${SPRING_RABBITMQ_ADDRESSES}
      BROKER_EXCHANGE_NAME: ${BROKER_EXCHANGE_NAME}
      BROKER_NOTIFICATION_QUEUE: ${BROKER_NOTIFICATION_QUEUE}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      BROKER_TYPE: ${BROKER_TYPE}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SNS_ENDPOINT: ${AWS_SNS_ENDPOINT:-http://host.docker.internal:4566}
      AWS_SQS_ENDPOINT: ${AWS_SQS_ENDPOINT:-http://host.docker.internal:4566}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}

volumes:
  sqlserver-data:
