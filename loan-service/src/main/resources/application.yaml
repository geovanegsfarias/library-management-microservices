spring:
  application:
    name: loan-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=loan-service;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:sa}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:amqp://guest:guest@localhost:5672}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

server:
  port: 8082

book-service:
  url: ${BOOK_SERVICE_URL:http://localhost:8081}

broker:
  type: ${BROKER_TYPE:rabbitmq}
  rabbitmq:
    exchange-name: ${BROKER_EXCHANGE_NAME:}
    notification-queue: ${BROKER_NOTIFICATION_QUEUE:notification.queue}
  sns:
    arn: ${SNS_ARN:}
  sqs:
    queue-url: ${SQS_QUEUE_URL:}

app:
  scheduling:
    overdue-loan:
      cron: ${OVERDUE_LOAN_CRON:0 0 3 * * *}
      zone: ${OVERDUE_LOAN_ZONE:America/Sao_Paulo}
  jwt:
    public-key: ${JWT_PUBLIC_KEY_PATH:file:./src/main/resources/app.pub}
    private-key: ${JWT_PRIVATE_KEY_PATH:file:./src/main/resources/app.key}
  header:
    api-key: ${INTERNAL_API_KEY:1234}

springdoc:
  swagger-ui:
    operations-sorter: method
